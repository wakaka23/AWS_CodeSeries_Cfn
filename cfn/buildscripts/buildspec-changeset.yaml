version: 0.2

env:
  exported-variables:
    - COMMIT_HASH

phases:
  install:
    commands:
      - "aws --version"

  pre_build:
    commands:
      - echo "[Info] Current Directory"
      - pwd

      - echo "[Info] Sourcefiles Upload..."
      - export COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - aws s3 rm s3://${ARTIFACT_BUCKET_NAME}/source/$COMMIT_HASH/ --recursive --only-show-errors
      - aws s3 cp ./${CODE_SRC_DIR} s3://${ARTIFACT_BUCKET_NAME}/source/${COMMIT_HASH}/${CODE_SRC_DIR} --recursive --only-show-errors --exclude 'buildscripts/*'

  build:
    commands:
      # 変更セットの作成
      - echo "[Info] Creating change sets for target stacks..."
      - ./${CODE_SRC_DIR}/buildscripts/scripts/buildspec-changeset.sh

      # 変更セットのサマライズ
      - echo "[Info] Summarizing change sets..."
      - ./${CODE_SRC_DIR}/buildscripts/scripts/buildspec-summarize.sh

artifacts:
  files:
    - "**/*"